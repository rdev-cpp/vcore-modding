[book]
title = "VCore • Modding Guide"
authors = ["Velvetic", "rdev"]
description = "Official Lua modding documentation and API reference for the VCore 2D physics sandbox."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
additional-css = ["custom.css"]
additional-js = ["lang.js"]
default-theme = "coal"
preferred-dark-theme = "coal"
mathjax-support = false
admonitions = true
smart-punctuation = true
git-repository-url = "https://github.com/rdev-cpp/vcore-modding"
site-url = "/vcore-modding/"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1
